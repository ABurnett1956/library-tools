<!DOCTYPE html>
<!--
████████████████████████████████████████████████████████████████
  SOUTHLAKE PUBLIC LIBRARY: PRINT & COPY PRICE CALCULATOR
  Version 4, November 2026

  WHAT THIS IS
  A small stand-alone web page. It's hosted on GitHub Pages and
  shown inside the CivicPlus Services page in a frame (iframe),
  because CivicPlus removes JavaScript from its own pages.

  HOW IT WORKS
  Patrons type how many black-and-white copies and how many color
  copies they need (either one can be 0). Each copy is priced, the
  two are added together, and the whole order has a $1.00 minimum.

  TO CHANGE PRICES
  Only edit the PRICE SETTINGS section in the <script> near the
  bottom. Nothing else needs to change.
████████████████████████████████████████████████████████████████
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print and Copy Price Calculator | Southlake Public Library</title>
  <style>
    /* ---------- PAGE ---------- */
    body {
      margin: 0;
      padding: 8px;
      font-family: Arial, Helvetica, sans-serif;
      color: #222222;
      line-height: 1.6;
      background: #ffffff;
    }

    /* ---------- CALCULATOR BOX ---------- */
    .calc {
      max-width: 560px;
      border: 1px solid #dfe5e0;
      border-top: 4px solid #ac923c;   /* gold accent line */
      border-radius: 10px;
      padding: 24px 28px;
    }
    .calc h2 {
      font-family: 'Raleway', Arial, sans-serif;
      color: #183d20;
      font-size: 1.35em;
      margin: 0 0 20px 0;
    }

    /* ---------- NUMBER BOXES ---------- */
    .number-row { margin: 0 0 20px 0; }
    .number-row label {
      display: block;
      font-weight: bold;
      color: #183d20;
      margin: 0 0 6px 0;
    }
    .price-hint { display: block; font-size: 0.9em; color: #4a4a4a; margin: 4px 0 0 0; }
    input[type="number"] {
      font-size: 1.1em;
      width: 120px;
      padding: 8px 10px;
      border: 2px solid #8a9a8d;
      border-radius: 6px;
    }
    /* Clear focus outline for keyboard users (ADA) */
    input:focus { outline: 3px solid #ac923c; outline-offset: 2px; }

    /* ---------- RESULT ---------- */
    .result {
      background: #f4f6f4;
      border-radius: 8px;
      padding: 16px 20px;
      margin: 8px 0 0 0;
    }
    .result .total {
      display: block;
      font-size: 2em;
      font-weight: bold;
      color: #183d20;
      line-height: 1.2;
    }
    .result .line { display: block; margin: 4px 0 0 0; }

    .note { font-size: 0.9em; color: #4a4a4a; margin: 16px 0 0 0; }
  </style>
</head>
<body>

  <div class="calc">
    <h2>Estimate your printing cost</h2>

    <!-- BOX 1: black-and-white copies -->
    <div class="number-row">
      <label for="bw">Black-and-white copies</label>
      <input type="number" id="bw" min="0" max="9999" value="0" inputmode="numeric" aria-describedby="bw-hint">
      <span class="price-hint" id="bw-hint">$0.15 per copy</span>
    </div>

    <!-- BOX 2: color copies -->
    <div class="number-row">
      <label for="color">Color copies</label>
      <input type="number" id="color" min="0" max="9999" value="0" inputmode="numeric" aria-describedby="color-hint">
      <span class="price-hint" id="color-hint">$0.50 per copy</span>
    </div>

    <!-- RESULT: aria-live makes screen readers announce the new total -->
    <div class="result" aria-live="polite">
      <span class="total" id="total">$0.00</span>
      <span class="line" id="bw-line"></span>
      <span class="line" id="color-line"></span>
      <span class="line" id="min-line"></span>
    </div>

    <p class="note">Every order has a $1.00 minimum. This is an estimate. Staff will confirm your final price at the Library.</p>
  </div>


  <script>
    /* ============================================================
       PRICE SETTINGS: the only part you should need to edit
       ============================================================
       HOW PRICING WORKS
       1. Every copy has its own price:
            black and white = $0.15 per copy
            color           = $0.50 per copy
       2. Add black-and-white and color together.
       3. If the order total is under $1.00, the patron pays $1.00
          (the order minimum).

       Examples:
         2 B&W + 1 color = $0.30 + $0.50 = $0.80  -> pays $1.00
         16 B&W          = 16 x $0.15     = $2.40
         16 B&W + 3 color = $2.40 + $1.50 = $3.90

       If you change prices here, also update the grey price-hint
       lines in the HTML above.
    */
    var PRICES = {
      bw:    { perCopy: 0.15, name: "black-and-white" },
      color: { perCopy: 0.50, name: "color" }
    };
    var ORDER_MINIMUM = 1.00;
    /* ========================= END SETTINGS ========================= */


    // Grab the parts of the page we need
    var bwBox     = document.getElementById("bw");
    var colorBox  = document.getElementById("color");
    var totalText = document.getElementById("total");
    var bwLine    = document.getElementById("bw-line");
    var colorLine = document.getElementById("color-line");
    var minLine   = document.getElementById("min-line");

    // Turn whatever someone typed into a whole number, 0 or more
    function cleanNumber(box) {
      var n = parseInt(box.value, 10);
      return (isNaN(n) || n < 0) ? 0 : n;
    }

    // Write one line of the breakdown, like "16 black-and-white copies: $2.40"
    function describe(count, cost, p) {
      if (count === 0) return "";
      return count + " " + p.name + " cop" + (count === 1 ? "y" : "ies") + ": $" + cost.toFixed(2);
    }

    // Work out the total and show it
    function update() {
      var bwCount    = cleanNumber(bwBox);
      var colorCount = cleanNumber(colorBox);
      var bwCost     = bwCount * PRICES.bw.perCopy;
      var colorCost  = colorCount * PRICES.color.perCopy;
      var subtotal   = Math.round((bwCost + colorCost) * 100) / 100;   // round to whole cents
      var total      = subtotal;

      // Apply the $1.00 order minimum (only if they're printing something)
      if (subtotal > 0 && subtotal < ORDER_MINIMUM) {
        total = ORDER_MINIMUM;
        minLine.textContent = "Copies add up to $" + subtotal.toFixed(2) + ", so the $" + ORDER_MINIMUM.toFixed(2) + " minimum applies.";
      } else {
        minLine.textContent = "";
      }

      totalText.textContent = "$" + total.toFixed(2);
      bwLine.textContent    = describe(bwCount, bwCost, PRICES.bw);
      colorLine.textContent = describe(colorCount, colorCost, PRICES.color);
    }

    // Recalculate whenever someone types
    bwBox.addEventListener("input", update);
    colorBox.addEventListener("input", update);
    update();
  </script>

</body>
</html>
